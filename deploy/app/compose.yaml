# Backend stack on the shared VM. No edge here: the gaias-choice Caddy owns
# 80/443 and proxies vas.mokri-potok.si to this service over its compose
# network, which we join as an external network. Data is a host bind mount
# under /srv.
services:
  potok-api:
    image: ghcr.io/denisolnce/porta-pagi:${BE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8788"
      PUSH_SUBJECT: ${PUSH_SUBJECT:-https://vas.mokri-potok.si/}
      # The binary has no village in it: these name this one.
      VILLAGE_NAME: Mokri Potok
      LANGUAGES: sl,en
      PUBLIC_URL: https://vas.mokri-potok.si
      WEATHER_PROVIDER: arso
      WEATHER_LOCATION: Kočevje
      # Notifications say "today" / "tomorrow" against the village's own date.
      TZ: Europe/Ljubljana
      # The feedback chip: emailed through Resend when all three are set in the
      # VM's /opt/doco-cd/secrets.env (doco-cd PASS_ENV), else written to the
      # log. Empty is a valid state.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    # Feedback lands in the log until email is wired, reply addresses with it:
    # keep the log small.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Must be owned by uid 65532 on the host (image runs as nonroot).
      - /srv/mokri-potok/data:/data
    networks:
      - default
      - gaias
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  gaias:
    # The gaias-choice stack's default compose network — Caddy lives there.
    name: gaias-choice_default
    external: true
